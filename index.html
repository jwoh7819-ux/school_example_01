<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 포켓몬 찾기</title>
    <style>
        /* 기본 설정: 따뜻한 크림/노란색 톤, 초보자도 보기 편한 큰 글씨 */
        body {
            background-color: #FFFDF5; /* 따뜻한 크림색 배경 */
            color: #4A4A4A;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            color: #FF9800; /* 오렌지색 포인트 */
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px #FFE4B5;
        }

        p.subtitle {
            font-size: 1.2em;
            line-height: 1.5;
            color: #666;
            margin-bottom: 30px;
        }

        /* 16개 MBTI 버튼 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button.mbti-btn {
            background-color: #FFD54F; /* 따뜻한 노란색 버튼 */
            border: none;
            padding: 20px 10px;
            font-size: 1.3em;
            font-weight: bold;
            color: #5D4037;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.1s, background-color 0.2s;
        }

        button.mbti-btn:hover {
            background-color: #FFCA28;
            transform: scale(1.05);
        }

        /* 결과 화면 (처음엔 숨김) */
        .result-screen {
            display: none;
            background-color: #FFFFFF;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 4px solid #FFE082;
            margin-top: 20px;
        }

        .mbti-title {
            color: #888;
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .emoji {
            font-size: 100px;
            margin: 20px 0;
            line-height: 1;
        }

        .pokemon-name {
            font-size: 2.2em;
            font-weight: bold;
            color: #E65100;
            margin-bottom: 20px;
        }

        .desc {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #444;
            padding: 0 10px;
        }

        .match-box {
            font-size: 1.2em;
            background-color: #FFF3E0;
            padding: 15px 25px;
            border-radius: 15px;
            display: inline-block;
            color: #E65100;
            font-weight: bold;
        }

        .reset-btn {
            margin-top: 40px;
            background-color: #FF9800;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: #F57C00;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 첫 화면: MBTI 선택 -->
        <div id="home-screen">
            <h1>MBTI 포켓몬 찾기 🔍</h1>
            <p class="subtitle">나의 MBTI를 선택하고<br>나와 가장 잘 어울리는 포켓몬을 찾아보세요!</p>
            <div class="grid" id="mbti-grid">
                <!-- 자바스크립트로 버튼이 생성됩니다 -->
            </div>
        </div>

        <!-- 결과 화면: 포켓몬 출력 -->
        <div id="result-screen" class="result-screen">
            <div id="mbti-title" class="mbti-title"></div>
            <div id="pokemon-emoji" class="emoji"></div>
            <div id="pokemon-name" class="pokemon-name"></div>
            <div id="pokemon-desc" class="desc"></div>
            <div class="match-box">
                💖 찰떡 궁합: <span id="pokemon-match"></span>
            </div>
            <br>
            <button class="reset-btn" onclick="reset()">다시 고르기 🔄</button>
        </div>
    </div>

    <script>
        // 포켓몬 데이터 (16개 유형)
        const pokemonData = {
            "ISTJ": { name: "꼬부기", emoji: "🐢", desc: "성실하고 책임감이 강하며 묵묵히 제 할 일을 하는 모습이 꼭 닮았어요.<br>정해진 규칙을 잘 지키고 언제나 믿음직스럽답니다!", match: "ESTP" },
            "ISFJ": { name: "이상해씨", emoji: "🍃", desc: "따뜻하고 다정하며 주변 사람들을 묵묵히 챙기는 평화주의자예요.<br>인내심이 강하고 타인을 향한 배려심이 아주 깊습니다.", match: "ESFP" },
            "INFJ": { name: "라프라스", emoji: "🌊", desc: "신비롭고 깊은 내면을 가졌으며, 다른 사람을 돕는 것을 좋아해요.<br>뛰어난 통찰력으로 사람들의 마음을 따뜻하게 잘 이해합니다.", match: "ENFP" },
            "INTJ": { name: "뮤츠", emoji: "👽", desc: "냉철한 분석력과 뛰어난 지능을 가진 똑똑한 전략가 스타일이에요.<br>독립적이고 자신의 목표를 향해 흔들림 없이 나아갑니다.", match: "ENTP" },
            "ISTP": { name: "나무지기", emoji: "🦎", desc: "쿨하고 무심한 듯 보이지만 뛰어난 관찰력과 순발력을 자랑해요.<br>혼자만의 시간과 자유로움을 매우 중요하게 생각합니다.", match: "ESTJ" },
            "ISFP": { name: "푸린", emoji: "🎤", desc: "감수성이 풍부하고 따뜻하며 예술적인 영혼을 가졌어요.<br>갈등을 싫어하고 둥글둥글 평화로운 삶을 추구합니다.", match: "ESFJ" },
            "INFP": { name: "메타몽", emoji: "💟", desc: "유연하고 상상력이 풍부하며 상대방에게 잘 맞춰주는 배려심 깊은 성격이에요.<br>하지만 마음속엔 자신만의 뚜렷한 가치관을 품고 있습니다.", match: "ENFJ" },
            "INTP": { name: "야돈", emoji: "🦥", desc: "호기심이 많고 느긋해 보이지만, 머릿속엔 심오한 세계가 펼쳐져 있어요.<br>논리적이고 새로운 아이디어를 탐구하는 것을 좋아합니다.", match: "ENTJ" },
            "ESTP": { name: "피카츄", emoji: "⚡", desc: "에너지가 넘치고 호기심이 많아 어디서든 주인공이 되는 스타일!<br>활동적이고 매일매일 새로운 모험을 즐기는 활력소예요.", match: "ISTJ" },
            "ESFP": { name: "토게피", emoji: "🥚", desc: "밝고 명랑해서 주변 사람들을 즐겁게 해주는 최고의 분위기 메이커예요.<br>애교가 많고 사람들과 어울려 노는 것을 정말 사랑합니다.", match: "ISFJ" },
            "ENFP": { name: "이브이", emoji: "🦊", desc: "무한한 가능성을 가지고 있고 언제나 에너지가 넘치며 활발해요.<br>새로운 사람들과 어울리는 것을 좋아하고 무한 긍정맨입니다.", match: "INFJ" },
            "ENTP": { name: "팬텀", emoji: "👻", desc: "장난기가 많고 독창적이며 번뜩이는 아이디어로 모두를 놀라게 해요.<br>틀에 박힌 것을 싫어하고 새로운 도전을 즐기는 성격입니다.", match: "INTJ" },
            "ESTJ": { name: "리자몽", emoji: "🔥", desc: "리더십이 뛰어나고 목표를 향해 뜨겁게 돌진하는 열정적인 성격이에요.<br>매우 현실적이고 친구들에게 든든한 지원군이 되어줍니다.", match: "ISTP" },
            "ESFJ": { name: "럭키", emoji: "🌸", desc: "천사 같은 마음씨로 사람들을 보살피고 돕는 것을 가장 큰 기쁨으로 여겨요.<br>공감 능력이 뛰어나서 주변을 언제나 따뜻하게 만듭니다.", match: "ISFP" },
            "ENFJ": { name: "가디", emoji: "🐶", desc: "충성심이 강하고 다정하며, 사람들을 긍정적인 방향으로 이끌어줘요.<br>다정한 카리스마로 주변 사람들에게 늘 큰 힘이 됩니다.", match: "INFP" },
            "ENTJ": { name: "루카리오", emoji: "🐺", desc: "카리스마가 넘치고 결단력이 있으며, 어떤 어려움도 당당히 뚫고 나갑니다.<br>강한 의지와 추진력으로 자신이 세운 목표를 완벽하게 해내요.", match: "INTP" }
        };

        // 초기 화면에 16개 MBTI 버튼 생성
        const mbtiList = Object.keys(pokemonData);
        const grid = document.getElementById('mbti-grid');
        
        mbtiList.forEach(mbti => {
            const btn = document.createElement('button');
            btn.className = 'mbti-btn';
            btn.innerText = mbti;
            btn.onclick = () => showResult(mbti);
            grid.appendChild(btn);
        });

        // 결과 보여주기 함수
        function showResult(mbti) {
            // 홈 화면 숨기기
            document.getElementById('home-screen').style.display = 'none';
            
            // 데이터 가져오기
            const data = pokemonData[mbti];
            
            // 결과 화면에 데이터 넣기
            document.getElementById('mbti-title').innerText = mbti + " 유형의 당신은...";
            document.getElementById('pokemon-emoji').innerText = data.emoji;
            document.getElementById('pokemon-name').innerText = data.name;
            document.getElementById('pokemon-desc').innerHTML = data.desc;
            document.getElementById('pokemon-match').innerText = data.match;
            
            // 결과 화면 보여주기
            document.getElementById('result-screen').style.display = 'block';
        }

        // 다시 고르기 함수 (초기화)
        function reset() {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'block';
        }
    </script>
</body>
</html>
